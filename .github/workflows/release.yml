name: Release

# Cut a release by pushing a version tag; the tag is the version (gradle.properties only holds
# the development version), e.g.
#   git tag v0.2.0 && git push origin v0.2.0
# That attaches the jar to a GitHub Release, refreshes the rolling major release (v0) the
# Action downloads from, pushes the Docker image to GHCR, publishes the IntelliJ plugin to the
# JetBrains Marketplace, and moves the major tag so the Action can be pinned as
# officefloor/SinewSlim@v0.
#
# Everything that could stop a release is checked before anything is published: the secrets,
# the tag's form, the change notes, the build and tests, and the Plugin Verifier on every IDE. Only
# then do the publishing jobs run.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # all four from the OfficeFloor organisation (setup-jetbrains-publishing.sh in
      # officefloor/OfficeFloorMaintenance)
      - name: Check the publishing secrets
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in PUBLISH_TOKEN CERTIFICATE_CHAIN PRIVATE_KEY PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secrets:$missing (nothing was published)"
            exit 1
          fi
      # the tag is the version: v0.2.0 releases 0.2.0, stamped into the jar, the plugin and the image
      - name: Take the version from the tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH (nothing was published)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
      - name: Check plugin.xml has change notes for the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! grep -q "<b>$VERSION</b>" intellij/src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml has no change-notes entry <b>$VERSION</b> for the Marketplace (nothing was published)"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --console=plain -Pversion=${{ steps.version.outputs.version }} build
      - name: Build the IntelliJ plugin
        run: ./gradlew --console=plain -Pversion=${{ steps.version.outputs.version }} :intellij:buildPlugin
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: |
            cli/build/libs/sinew-slim.jar
            intellij/build/distributions/sinew-slim-*.zip

  verify-plugin:
    needs: build
    uses: ./.github/workflows/verify-plugin.yml

  github-release:
    needs: [build, verify-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: jar
      - name: Release the jar, and refresh the rolling major release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ref="$GITHUB_REF_NAME"            # v0.1.0
          major="${ref%%.*}"                # v0
          gh release create "$ref" cli/build/libs/sinew-slim.jar intellij/build/distributions/sinew-slim-*.zip \
            --title "$ref" --generate-notes
          if ! gh release view "$major" >/dev/null 2>&1; then
            gh release create "$major" --title "$major (the newest ${major}.x)" --latest=false \
              --notes "The newest ${major}.x release, for officefloor/SinewSlim@${major}. See the versioned releases for notes."
          fi
          gh release upload "$major" cli/build/libs/sinew-slim.jar --clobber

  docker:
    needs: [build, verify-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/officefloor/sinew-slim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.build.outputs.version }}

  # Sign and upload the plugin to the JetBrains Marketplace (RELEASING.md)
  marketplace:
    needs: [build, verify-plugin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish the plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew --console=plain -Pversion=${{ needs.build.outputs.version }} :intellij:publishPlugin

  # Move the major tag so @v0 runs the newest v0.x action.yml, which downloads the v0 jar.
  major-tag:
    needs: [github-release, docker, marketplace]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euo pipefail
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
