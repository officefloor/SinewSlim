# sinew-slim: GitLab CI template.
#
# Reviews each merge request against its base: a proposal for every touched method over the
# length cap, a redesign notice for each one that cannot be slimmed. Runs the published image,
# so there is nothing to install. Use it one of two ways:
#
#   1. copy the job below into your .gitlab-ci.yml, or
#   2. include it:
#        include:
#          - remote: 'https://raw.githubusercontent.com/officefloor/SinewSlim/v0/ci/gitlab-ci.yml'
#
# For the sticky MR note, add a CI/CD variable GITLAB_TOKEN holding a project or personal access
# token with the api scope. Without it the job still reviews and gates; it skips the note. The
# findings also show in the merge request's code quality widget. With enforcement: block (in
# .sinew-slim.yml, or SINEW_SLIM_ENFORCEMENT below) the job fails when a touched method crosses
# the cap or grows over it: mark it required to gate merges.

sinew-slim:
  image:
    name: ghcr.io/officefloor/sinew-slim:0     # pin to a major; use :0.1.0 to pin exactly
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    GIT_DEPTH: "0"                              # the full history, so the merge base is there
    SINEW_SLIM_ENFORCEMENT: ""                  # warn or block; empty keeps .sinew-slim.yml's
  script:
    - |
      set +e   # do not stop on a blocking verdict: report it, then gate at the end
      args="review --mode range --base $CI_MERGE_REQUEST_DIFF_BASE_SHA"
      if [ -n "$SINEW_SLIM_ENFORCEMENT" ]; then args="$args --enforcement $SINEW_SLIM_ENFORCEMENT"; fi
      sinew-slim $args --format markdown --out sinew-slim.md
      code=$?
      if [ "$code" = 1 ]; then exit 1; fi
      cat sinew-slim.md
      sinew-slim $args --format codequality --out gl-code-quality-report.json
      if [ -n "$GITLAB_TOKEN" ] && [ -s sinew-slim.md ]; then
        sinew-slim comment --provider gitlab --body-file sinew-slim.md \
          || echo "sinew-slim: could not post the MR note (GITLAB_TOKEN needs the api scope)"
      fi
      exit $code
  artifacts:
    when: always
    paths:
      - sinew-slim.md
    reports:
      codequality: gl-code-quality-report.json
    expire_in: 1 week
